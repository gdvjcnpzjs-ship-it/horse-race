<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MATRIX HORSE BET</title>

    <link id="appleTouchIcon" rel="apple-touch-icon">
    <style>
        :root {
            --bg-color: #050805;
            --main-green: #00ff66;
            --dim-green: #008833;
            --dark-green: #002200;
            --card-bg: rgba(10, 20, 10, 0.88);
            --jiku-color: #ff3366;
            --chuana-color: #ffaa00;
            --oana-color: #00ccff;
            --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Courier New', monospace, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: var(--font-family);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景デジタルレイン */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px;
            text-shadow: 0 0 8px var(--main-green);
        }

        header h1 {
            font-size: 1.25rem;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .sub-title {
            font-size: 0.68rem;
            color: var(--dim-green);
            letter-spacing: 1px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--dim-green);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(4px);
        }

        .panel-title {
            font-size: 0.82rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--main-green);
            padding-left: 6px;
        }

        /* 予算設定 */
        .budget-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-step {
            background: var(--dark-green);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-step:active {
            background: var(--main-green);
            color: #000;
        }

        .budget-display {
            flex: 1;
            text-align: center;
            font-size: 1.35rem;
            font-weight: bold;
            background: #000;
            border: 1px solid var(--dim-green);
            border-radius: 6px;
            padding: 6px 0;
            color: var(--main-green);
            text-shadow: 0 0 6px var(--main-green);
            font-family: 'Courier New', monospace;
        }

        /* リスク設定 */
        .risk-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .risk-btn {
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 8px 4px;
            font-size: 0.75rem;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            line-height: 1.3;
        }

        .risk-btn.active {
            border-color: var(--main-green);
            color: #000;
            background: var(--main-green);
            font-weight: bold;
            box-shadow: 0 0 8px var(--main-green);
        }

        /* 予算連動上限インジケーター */
        .limits-info {
            display: flex;
            justify-content: space-around;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.6);
            padding: 6px;
            border-radius: 4px;
            margin-top: 8px;
            border: 1px dashed var(--dim-green);
        }

            align-items: center;
