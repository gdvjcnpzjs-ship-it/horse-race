<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MATRIX HORSE BET</title>
    <!-- [指定条件] iPhoneホーム画面追加用アイコンタグ -->
    <link id="appleTouchIcon" rel="apple-touch-icon">
    <style>
        :root {
            --bg-color: #050805;
            --main-green: #00ff66;
            --dim-green: #008833;
            --dark-green: #002200;
            --card-bg: rgba(10, 20, 10, 0.88);
            --jiku-color: #ff3366;
            --chuana-color: #ffaa00;
            --oana-color: #00ccff;
            --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Courier New', monospace, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: var(--font-family);
            min-height: 100vh;
            padding: 8px 10px;
            padding-bottom: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景デジタルレイン */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 5px;
            text-shadow: 0 0 8px var(--main-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 生成されたアイコンの画面上プレビュー */
        .icon-preview {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--main-green);
            box-shadow: 0 0 8px var(--main-green);
        }

        header h1 {
            font-size: 1.05rem;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .sub-title {
            font-size: 0.6rem;
            color: var(--dim-green);
            letter-spacing: 0.8px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--dim-green);
            border-radius: 8px;
            padding: 8px 10px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(4px);
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--main-green);
            padding-left: 6px;
        }

        /* レース選択タブ（2×2グリッド） */
        .race-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding-bottom: 2px;
        }

        .race-tab {
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 4px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 0;
        }

        .race-tab.active {
            border-color: var(--main-green);
            color: var(--main-green);
            background: rgba(0, 255, 102, 0.1);
            box-shadow: 0 0 8px var(--main-green);
        }

        .race-tab-num {
            font-size: 0.78rem;
            font-weight: bold;
        }

        .race-tab-name {
            background: #000;
            border: 1px solid var(--dim-green);
            color: var(--main-green);
            font-size: 0.62rem;
            padding: 1px 4px;
            border-radius: 4px;
            flex: 1;
            max-width: 110px;
            font-family: var(--font-family);
        }
        .race-tab.active .race-tab-name {
            border-color: var(--main-green);
        }

        /* レース基礎情報フォーム（3カテゴリー省スペース配置） */
        .race-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 0.68rem;
        }

        .race-info-item {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--dim-green);
            border-radius: 5px;
            padding: 4px 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .race-info-item.span-2 {
            grid-column: span 2;
        }

        .race-info-label {
            font-size: 0.6rem;
            color: var(--dim-green);
            font-weight: bold;
            line-height: 1.1;
        }

        .race-info-input,
        .race-info-select {
            width: 100%;
            background: #000;
            border: 1px solid var(--dim-green);
            color: var(--main-green);
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.68rem;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .race-info-memo {
            width: 100%;
            min-height: 138px;
            background: #000;
            border: 1px dashed var(--dim-green);
            color: var(--main-green);
            border-radius: 4px;
            padding: 4px 5px;
            font-size: 0.64rem;
            line-height: 1.3;
            font-family: var(--font-family);
            outline: none;
            resize: vertical;
            user-select: text;
        }

        .race-info-input:focus,
        .race-info-select:focus,
        .race-info-memo:focus {
            border-color: var(--main-green);
            box-shadow: 0 0 5px rgba(0, 255, 102, 0.35);
        }

        /* 付与マーク選択パレット */
        .mark-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }

        .mark-select-btn {
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 4px 3px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
        }

        .mark-select-btn.active[data-mark="JIKU"] {
            border-color: var(--jiku-color);
            background: rgba(255, 51, 102, 0.25);
            color: var(--jiku-color);
            box-shadow: 0 0 6px var(--jiku-color);
        }

        .mark-select-btn.active[data-mark="CHUANA"] {
            border-color: var(--chuana-color);
            background: rgba(255, 170, 0, 0.25);
            color: var(--chuana-color);
            box-shadow: 0 0 6px var(--chuana-color);
        }

        .mark-select-btn.active[data-mark="OANA"] {
            border-color: var(--oana-color);
            background: rgba(0, 204, 255, 0.25);
            color: var(--oana-color);
            box-shadow: 0 0 6px var(--oana-color);
        }

        .mark-select-btn.active[data-mark="EXCLUDE"] {
            border-color: #888888;
            background: rgba(136, 136, 136, 0.25);
            color: #aaaaaa;
            box-shadow: 0 0 6px #888888;
        }

        /* 馬番トグルグリッド */
        .horse-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-top: 3px;
        }

        .horse-btn {
            height: 36px;
            background: #000;
            border: 1px solid var(--dim-green);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .horse-num {
            font-size: 0.82rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
            line-height: 1.05;
        }

        .horse-badge {
            font-size: 0.55rem;
            font-weight: bold;
            line-height: 1;
            margin-top: 1px;
        }

        .horse-btn[data-type="JIKU"] {
            border-color: var(--jiku-color);
            background: rgba(255, 51, 102, 0.2);
            box-shadow: 0 0 6px var(--jiku-color);
        }
        .horse-btn[data-type="JIKU"] .horse-num,
        .horse-btn[data-type="JIKU"] .horse-badge { color: var(--jiku-color); }

        .horse-btn[data-type="CHUANA"] {
            border-color: var(--chuana-color);
            background: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 6px var(--chuana-color);
        }
        .horse-btn[data-type="CHUANA"] .horse-num,
        .horse-btn[data-type="CHUANA"] .horse-badge { color: var(--chuana-color); }

        .horse-btn[data-type="OANA"] {
            border-color: var(--oana-color);
            background: rgba(0, 204, 255, 0.2);
            box-shadow: 0 0 6px var(--oana-color);
        }
        .horse-btn[data-type="OANA"] .horse-num,
        .horse-btn[data-type="OANA"] .horse-badge { color: var(--oana-color); }

        .horse-btn[data-type="EXCLUDE"] {
            border-color: #888888;
            background: rgba(136, 136, 136, 0.15);
            box-shadow: 0 0 6px #888888;
        }
        .horse-btn[data-type="EXCLUDE"] .horse-num,
        .horse-btn[data-type="EXCLUDE"] .horse-badge { color: #aaaaaa; }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-act {
            background: var(--dark-green);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            padding: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        .btn-act:active {
            background: var(--main-green);
            color: #000;
        }

        .btn-reset {
            border-color: #ff3366;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
        }
        .btn-reset:active {
            background: #ff3366;
            color: #000;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--main-green);
            color: #000;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 10px var(--main-green);
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <div class="header-title-area">
                <img id="headerIconPreview" class="icon-preview" alt="Icon Preview">
                <h1>SYSTEM: BET MATRIX</h1>
            </div>
            <div class="sub-title">SANRENPUKU & WIDE ALLOCATOR v2.2</div>
        </header>

        <!-- レース選択タブ（画面上部に独立） -->
        <div class="panel" style="padding: 6px 10px;">
            <div style="font-size: 0.62rem; color: var(--dim-green); margin-bottom: 4px; font-weight: bold;">[RACE SELECT]</div>
            <div class="race-tabs" id="raceTabs"></div>
        </div>

        <!-- レース基礎情報 -->
        <div class="panel" style="padding: 7px 10px;">
            <div class="panel-title" style="margin-bottom: 4px;">
                <span>[RACE INFO]</span>
                <span style="font-size:0.6rem; color:var(--dim-green);">レース基礎情報</span>
            </div>
            <div class="race-info-grid">
                <div class="race-info-item">
                    <label class="race-info-label" for="infoCourse">①コース判定</label>
                    <select id="infoCourse" class="race-info-select" onchange="updateRaceInfo('course', this.value)">
                        <option value="">選択</option>
                        <option value="差し有利＋２">差し有利＋２</option>
                        <option value="差し有利＋１">差し有利＋１</option>
                        <option value="フラット">フラット</option>
                        <option value="先行有利＋１">先行有利＋１</option>
                        <option value="先行有利＋２">先行有利＋２</option>
                    </select>
                    <textarea id="infoCourseMemo" class="race-info-memo" rows="6" placeholder="判定要素メモ" oninput="updateRaceInfo('courseMemo', this.value)"></textarea>
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoPace">②ペース判定</label>
                    <select id="infoPace" class="race-info-select" onchange="updateRaceInfo('pace', this.value)">
                        <option value="">選択</option>
                        <option value="スロー＋２">スロー＋２</option>
                        <option value="スロー＋１">スロー＋１</option>
                        <option value="フラット">フラット</option>
                        <option value="ハイ＋１">ハイ＋１</option>
                        <option value="ハイ＋２">ハイ＋２</option>
                    </select>
                    <textarea id="infoPaceMemo" class="race-info-memo" rows="6" placeholder="判定要素メモ" oninput="updateRaceInfo('paceMemo', this.value)"></textarea>
                </div>
                <div class="race-info-item span-2" style="flex-direction: row; align-items: center; gap: 8px;">
                    <label class="race-info-label" for="infoWeightType" style="white-space: nowrap;">③斤量</label>
                    <select id="infoWeightType" class="race-info-select" onchange="updateRaceInfo('weightType', this.value)">
                        <option value="">選択</option>
                        <option value="定量">定量</option>
                        <option value="別定">別定</option>
                        <option value="ハンデ">ハンデ</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- [3] SELECT HORSES -->
        <div class="panel">
            <div class="panel-title">
                <span>[3] SELECT HORSES</span>
                <span style="font-size:0.6rem; color:var(--dim-green);">マークを選んで馬番をタップ</span>
            </div>
            
            <!-- マーク選択パレット -->
            <div class="mark-selector" id="markSelector">
                <div class="mark-select-btn active" data-mark="JIKU" onclick="setMark('JIKU')">軸</div>
                <div class="mark-select-btn" data-mark="CHUANA" onclick="setMark('CHUANA')">中穴</div>
                <div class="mark-select-btn" data-mark="OANA" onclick="setMark('OANA')">大穴</div>
                <div class="mark-select-btn" data-mark="EXCLUDE" onclick="setMark('EXCLUDE')">消×</div>
            </div>

            <div class="horse-grid" id="horseGrid"></div>

            <div style="margin-top: 6px;">
                <button class="btn-act btn-reset" onclick="resetSelections()" style="width: 100%;">リセット</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">クリップボードにコピーしました</div>

    <script>
        const STORAGE_KEY = 'matrix_horse_bet_state';
        const RACE_COUNT = 4;
        const HORSE_COUNT = 18;
        const MARK_BADGE_MAP = {
            JIKU: '軸',
            CHUANA: '中',
            OANA: '大',
            EXCLUDE: '×'
        };
        const INFO_FIELDS = ['course', 'courseMemo', 'pace', 'paceMemo', 'weightType'];
        const SHARED_MEMO_FIELDS = ['courseMemo', 'paceMemo'];

        // --- 1. Apple Touch Icon (180x180 PNG Canvas) 動的生成 ---
        (function generateIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#050805';
            ctx.fillRect(0, 0, 180, 180);

            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 4;
            ctx.strokeRect(4, 4, 172, 172);

            const horseImage = new Image();
            horseImage.onload = function() {
                ctx.drawImage(horseImage, 20, 20, 140, 140);

                const dataUri = canvas.toDataURL('image/png');

                const appleIconLink = document.getElementById('appleTouchIcon');
                if (appleIconLink) {
                    appleIconLink.href = dataUri;
                }

                const headerPreview = document.getElementById('headerIconPreview');
                if (headerPreview) {
                    headerPreview.src = dataUri;
                }
            };

            horseImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAMAAAAvK2D7AAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAAZQTFRF////00003Uf3eAAAAMElEQVR42u3XQQqAMBAEwSj+/83DgxB8wToIup302k3Nmtda+952932e53mvh18mCwoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgr/C34mO3me53me53me53n/3AM4a1/vXwFvTAAAAABJRU5ErkJggg==';
        })();

        // --- 2. 背景 Matrix Digital Rain ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const chars = '0123456789ABCDEF★▲●';
        const fontSize = 14;
        let width = bgCanvas.width = window.innerWidth;
        let height = bgCanvas.height = window.innerHeight;
        let columns = Math.floor(width / fontSize) + 1;
        let drops = Array(columns).fill(1);

        window.addEventListener('resize', () => {
            const nextWidth = window.innerWidth;
            const nextHeight = window.innerHeight;
            width = bgCanvas.width = nextWidth;
            height = bgCanvas.height = nextHeight;

            const nextColumns = Math.floor(width / fontSize) + 1;
            if (nextColumns !== columns) {
                const nextDrops = Array(nextColumns).fill(1);
                for (let i = 0; i < Math.min(columns, nextColumns); i++) {
                    nextDrops[i] = drops[i];
                }
                columns = nextColumns;
                drops = nextDrops;
            }
        });

        function drawMatrix() {
            bgCtx.fillStyle = 'rgba(5, 8, 5, 0.1)';
            bgCtx.fillRect(0, 0, width, height);
            bgCtx.fillStyle = '#00ff66';
            bgCtx.font = fontSize + 'px monospace';

            const charLen = chars.length;
            for (let i = 0; i < columns; i++) {
                const text = chars.charAt((Math.random() * charLen) | 0);
                const y = drops[i] * fontSize;
                bgCtx.fillText(text, i * fontSize, y);
                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // --- 3. アプリケーション状態 & 構成 ---
        function createDefaultRaceInfo() {
            return {
                course: '',
                pace: '',
                weightType: ''
            };
        }

        function createDefaultSharedMemo() {
            return {
                courseMemo: '',
                paceMemo: ''
            };
        }

        function createDefaultRaceObj() {
            return {
                name: '',
                q1: null,
                q2: null,
                horses: {},
                info: createDefaultRaceInfo()
            };
        }

        function createInitialRaces() {
            const races = {};
            for (let r = 1; r <= RACE_COUNT; r++) {
                races[r] = createDefaultRaceObj();
            }
            return races;
        }

        let state = {
            currentRace: 1,
            selectedMark: 'JIKU',
            sharedMemo: createDefaultSharedMemo(),
            races: createInitialRaces()
        };

        // DOMキャッシュ
        const domRefs = {
            raceTabs: null,
            markButtons: null,
            horseGrid: null,
            horseButtons: [],
            infoInputs: {}
        };
        let toastTimer = null;

        function getCurrentRaceObj() {
            if (!state.races[state.currentRace]) {
                state.races[state.currentRace] = createDefaultRaceObj();
            }
            return state.races[state.currentRace];
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return;

                const parsed = JSON.parse(saved);
                if (parsed.sharedMemo) {
                    state.sharedMemo = Object.assign(createDefaultSharedMemo(), parsed.sharedMemo);
                }

                if (parsed.races) {
                    for (let i = 1; i <= RACE_COUNT; i++) {
                        const rawRace = parsed.races[i];
                        if (!rawRace) continue;

                        if (typeof rawRace === 'object' && rawRace.horses !== undefined) {
                            const rawInfo = rawRace.info || {};
                            if (!parsed.sharedMemo) {
                                if (rawInfo.courseMemo && !state.sharedMemo.courseMemo) {
                                    state.sharedMemo.courseMemo = rawInfo.courseMemo;
                                }
                                if (rawInfo.paceMemo && !state.sharedMemo.paceMemo) {
                                    state.sharedMemo.paceMemo = rawInfo.paceMemo;
                                }
                            }
                            state.races[i] = {
                                name: rawRace.name || '',
                                q1: rawRace.q1 !== undefined ? rawRace.q1 : null,
                                q2: rawRace.q2 !== undefined ? rawRace.q2 : null,
                                horses: rawRace.horses || {},
                                info: {
                                    course: rawInfo.course || '',
                                    pace: rawInfo.pace || '',
                                    weightType: rawInfo.weightType || ''
                                }
                            };
                        } else {
                            state.races[i] = {
                                name: '',
                                q1: null,
                                q2: null,
                                horses: rawRace || {},
                                info: createDefaultRaceInfo()
                            };
                        }
                    }
                }
                if (parsed.currentRace && parsed.currentRace >= 1 && parsed.currentRace <= RACE_COUNT) {
                    state.currentRace = parsed.currentRace;
                }
                if (parsed.selectedMark) {
                    state.selectedMark = parsed.selectedMark;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error(e);
            }
        }

        function selectRace(raceNum) {
            state.currentRace = raceNum;
            updateUI();
            saveState();
        }

        function setMark(mark) {
            state.selectedMark = mark;
            updateMarkSelectorUI();
            saveState();
        }

        function updateRaceName(raceNum, name) {
            if (!state.races[raceNum]) {
                state.races[raceNum] = createDefaultRaceObj();
            }
            state.races[raceNum].name = name;
            saveState();
        }

        function updateRaceInfo(field, value) {
            if (SHARED_MEMO_FIELDS.includes(field)) {
                if (!state.sharedMemo) {
                    state.sharedMemo = createDefaultSharedMemo();
                }
                state.sharedMemo[field] = value;
                saveState();
                return;
            }
            const raceObj = getCurrentRaceObj();
            if (!raceObj.info) {
                raceObj.info = createDefaultRaceInfo();
            }
            raceObj.info[field] = value;
            saveState();
        }

        function setFlowQ1(val) {
            const race = getCurrentRaceObj();
            race.q1 = val;
            race.q2 = null; // リセット
            updateCombinations(race);
            saveState();
        }

        function setFlowQ2(val) {
            const race = getCurrentRaceObj();
            race.q2 = val;
            updateCombinations(race);
            saveState();
        }

        function toggleHorse(num) {
            const currentRaceObj = getCurrentRaceObj();
            if (!currentRaceObj.horses) {
                currentRaceObj.horses = {};
            }
            const horses = currentRaceObj.horses;
            const current = horses[num] || 'NONE';
            const nextType = current === state.selectedMark ? null : state.selectedMark;

            if (nextType === null) {
                delete horses[num];
            } else {
                horses[num] = nextType;
            }

            updateHorseButtonUI(num, nextType || 'NONE');
            updateCombinations(currentRaceObj);
            saveState();
        }

        function resetSelections() {
            const raceObj = getCurrentRaceObj();
            raceObj.name = '';
            raceObj.horses = {};
            raceObj.q1 = null;
            raceObj.q2 = null;
            raceObj.info = createDefaultRaceInfo();
            updateUI();
            saveState();
        }

        function initStaticDOM() {
            domRefs.raceTabs = document.getElementById('raceTabs');
            domRefs.markButtons = Array.from(document.querySelectorAll('.mark-select-btn'));
            domRefs.horseGrid = document.getElementById('horseGrid');

            INFO_FIELDS.forEach(field => {
                const id = 'info' + field.charAt(0).toUpperCase() + field.slice(1);
                domRefs.infoInputs[field] = document.getElementById(id);
            });

            // レースタブ（1〜4）を初回のみ生成
            const tabFragment = document.createDocumentFragment();
            for (let r = 1; r <= RACE_COUNT; r++) {
                const tab = document.createElement('div');
                tab.className = 'race-tab';
                tab.dataset.race = r;

                const numSpan = document.createElement('span');
                numSpan.className = 'race-tab-num';
                numSpan.textContent = r;

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'race-tab-name';
                nameInput.placeholder = 'レース名';
                nameInput.addEventListener('input', (e) => updateRaceName(r, e.target.value));
                nameInput.addEventListener('click', (e) => e.stopPropagation());

                tab.addEventListener('click', () => selectRace(r));
                tab.appendChild(numSpan);
                tab.appendChild(nameInput);
                tabFragment.appendChild(tab);
            }
            domRefs.raceTabs.appendChild(tabFragment);

            // 馬番グリッド（1〜18）を初回のみ生成
            const horseFragment = document.createDocumentFragment();
            domRefs.horseButtons = new Array(HORSE_COUNT + 1);
            for (let i = 1; i <= HORSE_COUNT; i++) {
                const btn = document.createElement('div');
                btn.className = 'horse-btn';
                btn.setAttribute('data-type', 'NONE');
                btn.addEventListener('click', () => toggleHorse(i));

                const numDiv = document.createElement('div');
                numDiv.className = 'horse-num';
                numDiv.textContent = i < 10 ? '0' + i : String(i);

                const badgeDiv = document.createElement('div');
                badgeDiv.className = 'horse-badge';

                btn.appendChild(numDiv);
                btn.appendChild(badgeDiv);
                horseFragment.appendChild(btn);

                domRefs.horseButtons[i] = {
                    el: btn,
                    badgeEl: badgeDiv
                };
            }
            domRefs.horseGrid.appendChild(horseFragment);
        }

        function updateRaceTabsUI() {
            const tabs = domRefs.raceTabs.children;
            for (let idx = 0; idx < tabs.length; idx++) {
                const r = idx + 1;
                const tab = tabs[idx];
                const raceData = state.races[r] || createDefaultRaceObj();
                tab.classList.toggle('active', state.currentRace === r);

                const input = tab.querySelector('.race-tab-name');
                const nextVal = raceData.name || '';
                if (input.value !== nextVal) {
                    input.value = nextVal;
                }
            }
        }

        function updateRaceInfoUI(currentRaceObj) {
            const raceInfo = Object.assign(createDefaultRaceInfo(), currentRaceObj.info || {});
            const sharedMemo = Object.assign(createDefaultSharedMemo(), state.sharedMemo || {});
            const mergedInfo = Object.assign({}, raceInfo, sharedMemo);

            for (let i = 0; i < INFO_FIELDS.length; i++) {
                const field = INFO_FIELDS[i];
                const el = domRefs.infoInputs[field];
                if (el && el.value !== mergedInfo[field]) {
                    el.value = mergedInfo[field];
                }
            }
        }

        function updateMarkSelectorUI() {
            for (let i = 0; i < domRefs.markButtons.length; i++) {
                const btn = domRefs.markButtons[i];
                btn.classList.toggle('active', btn.getAttribute('data-mark') === state.selectedMark);
            }
        }

        function updateHorseButtonUI(num, type) {
            const item = domRefs.horseButtons[num];
            if (!item) return;
            item.el.setAttribute('data-type', type);
            item.badgeEl.textContent = MARK_BADGE_MAP[type] || '';
        }

        function updateHorseGridUI(currentHorses) {
            for (let i = 1; i <= HORSE_COUNT; i++) {
                updateHorseButtonUI(i, currentHorses[i] || 'NONE');
            }
        }

        function updateUI() {
            updateRaceTabsUI();

            const currentRaceObj = getCurrentRaceObj();
            updateRaceInfoUI(currentRaceObj);
            updateCombinations(currentRaceObj);
            updateMarkSelectorUI();
            updateHorseGridUI(currentRaceObj.horses || {});
        }

        function updateCombinations(currentRaceObj) {
            const combTerminal = document.getElementById('combTerminal');
            if (!combTerminal) return;
            const q1 = currentRaceObj.q1;
            const q2 = currentRaceObj.q2;
            const horses = currentRaceObj.horses || {};

            const jiku = [];
            const chuana = [];
            const oana = [];

            for (const num in horses) {
                const type = horses[num];
                const n = parseInt(num, 10);
                if (type === 'JIKU') jiku.push(n);
                else if (type === 'CHUANA') chuana.push(n);
                else if (type === 'OANA') oana.push(n);
            }

            let text = '';

            if (q1 === 'yes' && q2 === 'yes') {
                if (jiku.length === 1 && chuana.length === 2 && oana.length === 4) {
                    text = generateSanrenpuku3(jiku, chuana.concat(oana));
                } else {
                    text = '>> [条件未達成] 軸1頭、中穴2頭、大穴4頭（計7頭）を選択してください。';
                }
            } else if (q1 === 'yes' && q2 === 'no') {
                if (jiku.length === 1 && chuana.length === 3 && oana.length === 1) {
                    text = generateSanrenpuku3(jiku, chuana.concat(oana));
                } else {
                    text = '>> [条件未達成] 軸1頭、中穴3頭、大穴1頭（計5頭）を選択してください。';
                }
            } else if (q1 === 'no' && q2 === 'yes') {
                if (jiku.length === 2 && chuana.length === 5 && oana.length === 0) {
                    text = generateSanrenpuku6(jiku, chuana);
                } else {
                    text = '>> [条件未達成] 軸2頭、中穴5頭（計7頭）を選択してください。';
                }
            } else if (q1 === 'no' && q2 === 'no') {
                const total = jiku.length + chuana.length + oana.length;
                if (total === 5) {
                    text = generateBox(jiku.concat(chuana, oana), 3);
                } else {
                    text = '>> [条件未達成] 合計5頭を選択してください（3連複BOX）。';
                }
            } else {
                text = '>> [STATUS] フロー①〜②を選択し、条件に合った馬を選択してください。';
            }

            combTerminal.innerText = text;
        }

        function generateSanrenpuku3(jikus, others) {
            const results = [];
            const j = jikus[0];
            for (let i = 0; i < others.length; i++) {
                for (let k = i + 1; k < others.length; k++) {
                    results.push(`${j} - ${others[i]} - ${others[k]}`);
                }
            }
            return `[買い目一覧 (3連複軸1頭: 計${results.length}点)]\n` + results.join('\n');
        }

        function generateSanrenpuku6(jikus, others) {
            const results = [];
            const j1 = jikus[0];
            const j2 = jikus[1];
            for (let i = 0; i < others.length; i++) {
                results.push(`${j1} - ${j2} - ${others[i]}`);
            }
            return `[買い目一覧 (3連複軸2頭: 計${results.length}点)]\n` + results.join('\n');
        }

        function generateBox(arr, r) {
            const results = [];
            function combine(start, temp) {
                if (temp.length === r) {
                    results.push(temp.join(' - '));
                    return;
                }
                for (let i = start; i < arr.length; i++) {
                    temp.push(arr[i]);
                    combine(i + 1, temp);
                    temp.pop();
                }
            }
            combine(0, []);
            return `[買い目一覧 (3連複BOX: 計${results.length}点)]\n` + results.join('\n');
        }

        function copyCombinations() {
            const combTerminal = document.getElementById('combTerminal');
            if (!combTerminal) return;
            const text = combTerminal.innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast());
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            if (toastTimer) {
                clearTimeout(toastTimer);
            }
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                toastTimer = null;
            }, 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initStaticDOM();
            loadState();
            let hasData = false;
            for (let i = 1; i <= RACE_COUNT; i++) {
                const race = state.races[i];
                if (Object.keys(race.horses || {}).length > 0 || race.name || race.q1 !== null) {
                    hasData = true;
                    break;
                }
            }
            if (!hasData) {
                state.races[1] = { name: '東京11R', q1: 'yes', q2: 'yes', horses: { 1: 'JIKU', 5: 'CHUANA', 8: 'CHUANA', 12: 'OANA', 13: 'OANA', 14: 'OANA', 15: 'OANA' }, info: createDefaultRaceInfo() };
            }
            updateUI();
        });
    </script>
</body>
