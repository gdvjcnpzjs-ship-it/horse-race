<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MATRIX HORSE BET</title>
    <!-- [指定条件] iPhoneホーム画面追加用アイコンタグ -->
    <link id="appleTouchIcon" rel="apple-touch-icon">
    <style>
        :root {
            --bg-color: #050805;
            --main-green: #00ff66;
            --dim-green: #008833;
            --dark-green: #002200;
            --card-bg: rgba(10, 20, 10, 0.88);
            --jiku-color: #ff3366;
            --chuana-color: #ffaa00;
            --oana-color: #00ccff;
            --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Courier New', monospace, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: var(--font-family);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景デジタルレイン */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px;
            text-shadow: 0 0 8px var(--main-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 生成されたアイコンの画面上プレビュー */
        .icon-preview {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--main-green);
            box-shadow: 0 0 8px var(--main-green);
        }

        header h1 {
            font-size: 1.25rem;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .sub-title {
            font-size: 0.68rem;
            color: var(--dim-green);
            letter-spacing: 1px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--dim-green);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(4px);
        }

        .panel-title {
            font-size: 0.82rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--main-green);
            padding-left: 6px;
        }

        /* レース選択タブ（2×2グリッド） */
        .race-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding-bottom: 4px;
        }

        .race-tab {
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 6px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 0;
        }

        .race-tab.active {
            border-color: var(--main-green);
            color: var(--main-green);
            background: rgba(0, 255, 102, 0.1);
            box-shadow: 0 0 8px var(--main-green);
        }

        .race-tab-num {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .race-tab-name {
            background: #000;
            border: 1px solid var(--dim-green);
            color: var(--main-green);
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            flex: 1;
            max-width: 120px;
            font-family: var(--font-family);
        }
        .race-tab.active .race-tab-name {
            border-color: var(--main-green);
        }

        /* レース基礎情報フォーム（コンパクト配置） */
        .race-info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            font-size: 0.72rem;
        }

        .race-info-item {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--dim-green);
            border-radius: 5px;
            padding: 5px 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .race-info-item.span-2 {
            grid-column: span 2;
        }

        .race-info-label {
            font-size: 0.62rem;
            color: var(--dim-green);
            font-weight: bold;
            line-height: 1.1;
        }

        .race-info-input,
        .race-info-select {
            width: 100%;
            background: #000;
            border: 1px solid var(--dim-green);
            color: var(--main-green);
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 0.72rem;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .race-info-input:focus,
        .race-info-select:focus {
            border-color: var(--main-green);
            box-shadow: 0 0 5px rgba(0, 255, 102, 0.35);
        }

        /* 付与マーク選択パレット */
        .mark-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .mark-select-btn {
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 6px 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }

        .mark-select-btn.active[data-mark="JIKU"] {
            border-color: var(--jiku-color);
            background: rgba(255, 51, 102, 0.25);
            color: var(--jiku-color);
            box-shadow: 0 0 6px var(--jiku-color);
        }

        .mark-select-btn.active[data-mark="CHUANA"] {
            border-color: var(--chuana-color);
            background: rgba(255, 170, 0, 0.25);
            color: var(--chuana-color);
            box-shadow: 0 0 6px var(--chuana-color);
        }

        .mark-select-btn.active[data-mark="OANA"] {
            border-color: var(--oana-color);
            background: rgba(0, 204, 255, 0.25);
            color: var(--oana-color);
            box-shadow: 0 0 6px var(--oana-color);
        }

        .mark-select-btn.active[data-mark="EXCLUDE"] {
            border-color: #888888;
            background: rgba(136, 136, 136, 0.25);
            color: #aaaaaa;
            box-shadow: 0 0 6px #888888;
        }

        /* 馬番トグルグリッド */
        .horse-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .horse-btn {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid var(--dim-green);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .horse-num {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .horse-badge {
            font-size: 0.6rem;
            font-weight: bold;
            line-height: 1;
            margin-top: 2px;
        }

        .horse-btn[data-type="JIKU"] {
            border-color: var(--jiku-color);
            background: rgba(255, 51, 102, 0.2);
            box-shadow: 0 0 6px var(--jiku-color);
        }
        .horse-btn[data-type="JIKU"] .horse-num,
        .horse-btn[data-type="JIKU"] .horse-badge { color: var(--jiku-color); }

        .horse-btn[data-type="CHUANA"] {
            border-color: var(--chuana-color);
            background: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 6px var(--chuana-color);
        }
        .horse-btn[data-type="CHUANA"] .horse-num,
        .horse-btn[data-type="CHUANA"] .horse-badge { color: var(--chuana-color); }

        .horse-btn[data-type="OANA"] {
            border-color: var(--oana-color);
            background: rgba(0, 204, 255, 0.2);
            box-shadow: 0 0 6px var(--oana-color);
        }
        .horse-btn[data-type="OANA"] .horse-num,
        .horse-btn[data-type="OANA"] .horse-badge { color: var(--oana-color); }

        .horse-btn[data-type="EXCLUDE"] {
            border-color: #888888;
            background: rgba(136, 136, 136, 0.15);
            box-shadow: 0 0 6px #888888;
        }
        .horse-btn[data-type="EXCLUDE"] .horse-num,
        .horse-btn[data-type="EXCLUDE"] .horse-badge { color: #aaaaaa; }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-act {
            background: var(--dark-green);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .btn-act:active {
            background: var(--main-green);
            color: #000;
        }

        .btn-reset {
            border-color: #ff3366;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
        }
        .btn-reset:active {
            background: #ff3366;
            color: #000;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--main-green);
            color: #000;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 10px var(--main-green);
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <div class="header-title-area">
                <img id="headerIconPreview" class="icon-preview" alt="Icon Preview">
                <h1>SYSTEM: BET MATRIX</h1>
            </div>
            <div class="sub-title">SANRENPUKU & WIDE ALLOCATOR v2.2</div>
        </header>

        <!-- レース選択タブ（画面上部に独立） -->
        <div class="panel" style="padding: 8px 12px;">
            <div style="font-size: 0.7rem; color: var(--dim-green); margin-bottom: 6px; font-weight: bold;">[RACE SELECT]</div>
            <div class="race-tabs" id="raceTabs"></div>
        </div>

        <!-- レース基礎情報 -->
        <div class="panel" style="padding: 10px 12px;">
            <div class="panel-title" style="margin-bottom: 6px;">
                <span>[RACE INFO]</span>
                <span style="font-size:0.65rem; color:var(--dim-green);">レース基礎情報</span>
            </div>
            <div class="race-info-grid">
                <div class="race-info-item">
                    <label class="race-info-label" for="infoVenue">開催場</label>
                    <select id="infoVenue" class="race-info-select" onchange="updateRaceInfo('venue', this.value)">
                        <option value="">選択</option>
                        <option value="東京">東京</option>
                        <option value="中山">中山</option>
                        <option value="京都">京都</option>
                    </select>
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoRound">開催ラウンド数</label>
                    <input type="text" id="infoRound" class="race-info-input" placeholder="例: 1R" oninput="updateRaceInfo('round', this.value)">
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoTurn">回り</label>
                    <select id="infoTurn" class="race-info-select" onchange="updateRaceInfo('turn', this.value)">
                        <option value="">選択</option>
                        <option value="右回り">右回り</option>
                        <option value="左回り">左回り</option>
                    </select>
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoDistance">距離</label>
                    <input type="text" id="infoDistance" class="race-info-input" placeholder="例: 1600m" oninput="updateRaceInfo('distance', this.value)">
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoWeightType">斤量</label>
                    <select id="infoWeightType" class="race-info-select" onchange="updateRaceInfo('weightType', this.value)">
                        <option value="">選択</option>
                        <option value="定量">定量</option>
                        <option value="別定">別定</option>
                        <option value="ハンデ">ハンデ</option>
                    </select>
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoTrack">馬場</label>
                    <select id="infoTrack" class="race-info-select" onchange="updateRaceInfo('track', this.value)">
                        <option value="">選択</option>
                        <option value="良">良</option>
                        <option value="稍重">稍重</option>
                        <option value="重">重</option>
                        <option value="不良">不良</option>
                    </select>
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoSeason">季節</label>
                    <select id="infoSeason" class="race-info-select" onchange="updateRaceInfo('season', this.value)">
                        <option value="">選択</option>
                        <option value="春">春</option>
                        <option value="夏">夏</option>
                        <option value="秋">秋</option>
                        <option value="冬">冬</option>
                    </select>
                </div>
                <div class="race-info-item">
                    <label class="race-info-label" for="infoTemp">気温</label>
                    <input type="text" id="infoTemp" class="race-info-input" placeholder="例: 20℃" oninput="updateRaceInfo('temp', this.value)">
                </div>
            </div>
        </div>

        <!-- [3] SELECT HORSES -->
        <div class="panel">
            <div class="panel-title">
                <span>[3] SELECT HORSES</span>
                <span style="font-size:0.65rem; color:var(--dim-green);">マークを選んで馬番をタップ</span>
            </div>
            
            <!-- マーク選択パレット -->
            <div class="mark-selector" id="markSelector">
                <div class="mark-select-btn active" data-mark="JIKU" onclick="setMark('JIKU')">軸</div>
                <div class="mark-select-btn" data-mark="CHUANA" onclick="setMark('CHUANA')">中穴</div>
                <div class="mark-select-btn" data-mark="OANA" onclick="setMark('OANA')">大穴</div>
                <div class="mark-select-btn" data-mark="EXCLUDE" onclick="setMark('EXCLUDE')">消×</div>
            </div>

            <div class="horse-grid" id="horseGrid"></div>

            <div style="margin-top: 8px;">
                <button class="btn-act btn-reset" onclick="resetSelections()" style="width: 100%;">リセット</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">クリップボードにコピーしました</div>

    <script>
        // --- 1. Apple Touch Icon (180x180 PNG Canvas) 動的生成 ---
        (function generateIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#050805';
            ctx.fillRect(0, 0, 180, 180);

            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 4;
            ctx.strokeRect(4, 4, 172, 172);

            const horseImage = new Image();
            horseImage.onload = function() {
                ctx.drawImage(horseImage, 20, 20, 140, 140);

                const dataUri = canvas.toDataURL('image/png');

                const appleIconLink = document.getElementById('appleTouchIcon');
                if (appleIconLink) {
                    appleIconLink.href = dataUri;
                }

                const headerPreview = document.getElementById('headerIconPreview');
                if (headerPreview) {
                    headerPreview.src = dataUri;
                }
            };

            horseImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAMAAAAvK2D7AAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAAZQTFRF////00003Uf3eAAAAMElEQVR42u3XQQqAMBAEwSj+/83DgxB8wToIup302k3Nmtda+952932e53mvh18mCwoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgr/C34mO3me53me53me53n/3AM4a1/vXwFvTAAAAABJRU5ErkJggg==';
        })();

        // --- 2. 背景 Matrix Digital Rain ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width = bgCanvas.width = window.innerWidth;
        let height = bgCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
        });

        const chars = '0123456789ABCDEF★▲●';
        const fontSize = 14;
        const columns = Math.floor(width / fontSize) + 1;
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            bgCtx.fillStyle = 'rgba(5, 8, 5, 0.1)';
            bgCtx.fillRect(0, 0, width, height);
            bgCtx.fillStyle = '#00ff66';
            bgCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                bgCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // --- 3. アプリケーション状態 & 構成 ---
        function createDefaultRaceInfo() {
            return {
                venue: '',
                round: '',
                turn: '',
                distance: '',
                weightType: '',
                track: '',
                season: '',
                temp: ''
            };
        }

        function createDefaultRaceObj() {
            return {
                name: '',
                q1: null,
                q2: null,
                horses: {},
                info: createDefaultRaceInfo()
            };
        }

        let state = {
            currentRace: 1,
            selectedMark: 'JIKU',
            races: {
                1: createDefaultRaceObj(),
                2: createDefaultRaceObj(),
                3: createDefaultRaceObj(),
                4: createDefaultRaceObj()
            }
        };

        function loadState() {
            try {
                const saved = localStorage.getItem('matrix_horse_bet_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.races) {
                        for (let i = 1; i <= 4; i++) {
                            if (parsed.races[i]) {
                                if (typeof parsed.races[i] === 'object' && parsed.races[i].horses !== undefined) {
                                    state.races[i] = {
                                        name: parsed.races[i].name || '',
                                        q1: parsed.races[i].q1 !== undefined ? parsed.races[i].q1 : null,
                                        q2: parsed.races[i].q2 !== undefined ? parsed.races[i].q2 : null,
                                        horses: parsed.races[i].horses || {},
                                        info: Object.assign(createDefaultRaceInfo(), parsed.races[i].info || {})
                                    };
                                } else {
                                    state.races[i] = {
                                        name: '',
                                        q1: null,
                                        q2: null,
                                        horses: parsed.races[i] || {},
                                        info: createDefaultRaceInfo()
                                    };
                                }
                            }
                        }
                    }
                    if (parsed.currentRace && parsed.currentRace <= 4) {
                        state.currentRace = parsed.currentRace;
                    }
                    if (parsed.selectedMark) {
                        state.selectedMark = parsed.selectedMark;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('matrix_horse_bet_state', JSON.stringify(state));
            } catch (e) {
                console.error(e);
            }
        }

        function selectRace(raceNum) {
            state.currentRace = raceNum;
            updateUI();
            saveState();
        }

        function setMark(mark) {
            state.selectedMark = mark;
            updateUI();
            saveState();
        }

        function updateRaceName(raceNum, name) {
            if (!state.races[raceNum]) {
                state.races[raceNum] = createDefaultRaceObj();
            }
            state.races[raceNum].name = name;
            saveState();
        }

        function updateRaceInfo(field, value) {
            if (!state.races[state.currentRace]) {
                state.races[state.currentRace] = createDefaultRaceObj();
            }
            if (!state.races[state.currentRace].info) {
                state.races[state.currentRace].info = createDefaultRaceInfo();
            }
            state.races[state.currentRace].info[field] = value;
            saveState();
        }

        function setFlowQ1(val) {
            const race = state.races[state.currentRace];
            race.q1 = val;
            race.q2 = null; // リセット
            updateUI();
            saveState();
        }

        function setFlowQ2(val) {
            const race = state.races[state.currentRace];
            race.q2 = val;
            updateUI();
            saveState();
        }

        function toggleHorse(num) {
            if (!state.races[state.currentRace]) {
                state.races[state.currentRace] = createDefaultRaceObj();
            }
            const currentRaceObj = state.races[state.currentRace];
            const horses = currentRaceObj.horses || {};
            const current = horses[num] || 'NONE';

            if (current === state.selectedMark) {
                delete horses[num];
            } else {
                horses[num] = state.selectedMark;
            }
            currentRaceObj.horses = horses;

            updateUI();
            saveState();
        }

        function resetSelections() {
            if (state.races[state.currentRace]) {
                state.races[state.currentRace].horses = {};
                state.races[state.currentRace].q1 = null;
                state.races[state.currentRace].q2 = null;
                state.races[state.currentRace].info = createDefaultRaceInfo();
            }
            updateUI();
            saveState();
        }

        function updateUI() {
            // タブの描画 (1〜4)
            const tabsContainer = document.getElementById('raceTabs');
            tabsContainer.innerHTML = '';
            for (let r = 1; r <= 4; r++) {
                const tab = document.createElement('div');
                tab.className = `race-tab ${state.currentRace === r ? 'active' : ''}`;
                
                const raceData = state.races[r] || createDefaultRaceObj();
                
                tab.innerHTML = `
                    <span class="race-tab-num">${r}</span>
                    <input type="text" class="race-tab-name" placeholder="レース名" value="${raceData.name || ''}" oninput="updateRaceName(${r}, this.value)" onclick="event.stopPropagation()">
                `;
                tab.onclick = () => selectRace(r);
                tabsContainer.appendChild(tab);
            }

            // レース基礎情報の反映
            const currentRaceObj = state.races[state.currentRace] || createDefaultRaceObj();
            const raceInfo = Object.assign(createDefaultRaceInfo(), currentRaceObj.info || {});
            document.getElementById('infoVenue').value = raceInfo.venue;
            document.getElementById('infoRound').value = raceInfo.round;
            document.getElementById('infoTurn').value = raceInfo.turn;
            document.getElementById('infoDistance').value = raceInfo.distance;
            document.getElementById('infoWeightType').value = raceInfo.weightType;
            document.getElementById('infoTrack').value = raceInfo.track;
            document.getElementById('infoSeason').value = raceInfo.season;
            document.getElementById('infoTemp').value = raceInfo.temp;

            // 組み合わせ表示の更新
            updateCombinations(currentRaceObj);

            // マーク選択パレットの活性状態更新
            const markButtons = document.querySelectorAll('.mark-select-btn');
            markButtons.forEach(btn => {
                const mark = btn.getAttribute('data-mark');
                if (mark === state.selectedMark) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 馬番グリッドの描画 (18枠に変更)
            const grid = document.getElementById('horseGrid');
            grid.innerHTML = '';
            const currentHorses = currentRaceObj.horses || {};
            for (let i = 1; i <= 18; i++) {
                const btn = document.createElement('div');
                const type = currentHorses[i] || 'NONE';
                btn.className = 'horse-btn';
                btn.setAttribute('data-type', type);
                btn.onclick = () => toggleHorse(i);

                let badge = '';
                if (type === 'JIKU') badge = '軸';
                else if (type === 'CHUANA') badge = '中';
                else if (type === 'OANA') badge = '大';
                else if (type === 'EXCLUDE') badge = '×';

                btn.innerHTML = `
                    <div class="horse-num">${i < 10 ? '0' + i : i}</div>
                    <div class="horse-badge">${badge}</div>
                `;
                grid.appendChild(btn);
            }
        }

        function updateCombinations(currentRaceObj) {
            const combTerminal = document.getElementById('combTerminal');
            if (!combTerminal) return;
            const q1 = currentRaceObj.q1;
            const q2 = currentRaceObj.q2;
            const horses = currentRaceObj.horses || {};

            let jiku = [];
            let chuana = [];
            let oana = [];

            for (let num in horses) {
                const type = horses[num];
                const n = parseInt(num);
                if (type === 'JIKU') jiku.push(n);
                else if (type === 'CHUANA') chuana.push(n);
                else if (type === 'OANA') oana.push(n);
            }

            let text = '';

            if (q1 === 'yes' && q2 === 'yes') {
                if (jiku.length === 1 && chuana.length === 2 && oana.length === 4) {
                    text = generateSanrenpuku3(jiku, [...chuana, ...oana]);
                } else {
                    text = '>> [条件未達成] 軸1頭、中穴2頭、大穴4頭（計7頭）を選択してください。';
                }
            } else if (q1 === 'yes' && q2 === 'no') {
                if (jiku.length === 1 && chuana.length === 3 && oana.length === 1) {
                    text = generateSanrenpuku3(jiku, [...chuana, ...oana]);
                } else {
                    text = '>> [条件未達成] 軸1頭、中穴3頭、大穴1頭（計5頭）を選択してください。';
                }
            } else if (q1 === 'no' && q2 === 'yes') {
                if (jiku.length === 2 && chuana.length === 5 && oana.length === 0) {
                    text = generateSanrenpuku6(jiku, chuana);
                } else {
                    text = '>> [条件未達成] 軸2頭、中穴5頭（計7頭）を選択してください。';
                }
            } else if (q1 === 'no' && q2 === 'no') {
                const total = jiku.length + chuana.length + oana.length;
                if (total === 5) {
                    text = generateBox([...jiku, ...chuana, ...oana], 3);
                } else {
                    text = '>> [条件未達成] 合計5頭を選択してください（3連複BOX）。';
                }
            } else {
                text = '>> [STATUS] フロー①〜②を選択し、条件に合った馬を選択してください。';
            }

            combTerminal.innerText = text;
        }

        function generateSanrenpuku3(jikus, others) {
            let results = [];
            const j = jikus[0];
            for (let i = 0; i < others.length; i++) {
                for (let k = i + 1; k < others.length; k++) {
                    results.push(`${j} - ${others[i]} - ${others[k]}`);
                }
            }
            return `[買い目一覧 (3連複軸1頭: 計${results.length}点)]\n` + results.join('\n');
        }

        function generateSanrenpuku6(jikus, others) {
            let results = [];
            const j1 = jikus[0];
            const j2 = jikus[1];
            for (let i = 0; i < others.length; i++) {
                results.push(`${j1} - ${j2} - ${others[i]}`);
            }
            return `[買い目一覧 (3連複軸2頭: 計${results.length}点)]\n` + results.join('\n');
        }

        function generateBox(arr, r) {
            let results = [];
            function combine(start, temp) {
                if (temp.length === r) {
                    results.push(temp.join(' - '));
                    return;
                }
                for (let i = start; i < arr.length; i++) {
                    combine(i + 1, [...temp, arr[i]]);
                }
            }
            combine(0, []);
            return `[買い目一覧 (3連複BOX: 計${results.length}点)]\n` + results.join('\n');
        }

        function copyCombinations() {
            const combTerminal = document.getElementById('combTerminal');
            if (!combTerminal) return;
            const text = combTerminal.innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast());
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            let hasData = false;
            for (let i = 1; i <= 4; i++) {
                if (Object.keys(state.races[i].horses || {}).length > 0 || state.races[i].name || state.races[i].q1 !== null) {
                    hasData = true;
                    break;
                }
            }
            if (!hasData) {
                state.races[1] = { name: '東京11R', q1: 'yes', q2: 'yes', horses: { 1: 'JIKU', 5: 'CHUANA', 8: 'CHUANA', 12: 'OANA', 13: 'OANA', 14: 'OANA', 15: 'OANA' }, info: createDefaultRaceInfo() };
            }
            updateUI();
        });
    </script>
</body>
</html>
