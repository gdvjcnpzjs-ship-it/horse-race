<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MATRIX HORSE BET</title>
    <!-- [指定条件] iPhoneホーム画面追加用アイコンタグ -->
    <link id="appleTouchIcon" rel="apple-touch-icon">
    <style>
        :root {
            --bg-color: #050805;
            --main-green: #00ff66;
            --dim-green: #008833;
            --dark-green: #002200;
            --card-bg: rgba(10, 20, 10, 0.88);
            --jiku-color: #ff3366;
            --chuana-color: #ffaa00;
            --oana-color: #00ccff;
            --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Courier New', monospace, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: var(--font-family);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景デジタルレイン */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px;
            text-shadow: 0 0 8px var(--main-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 生成されたアイコンの画面上プレビュー */
        .icon-preview {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--main-green);
            box-shadow: 0 0 8px var(--main-green);
        }

        header h1 {
            font-size: 1.25rem;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .sub-title {
            font-size: 0.68rem;
            color: var(--dim-green);
            letter-spacing: 1px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--dim-green);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(4px);
        }

        .panel-title {
            font-size: 0.82rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--main-green);
            padding-left: 6px;
        }

        /* レース選択タブ */
        .race-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .race-tab {
            flex: 0 0 auto;
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 6px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 95px;
        }

        .race-tab.active {
            border-color: var(--main-green);
            color: var(--main-green);
            background: rgba(0, 255, 102, 0.1);
            box-shadow: 0 0 8px var(--main-green);
        }

        .race-tab-num {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .race-tab-name {
            background: #000;
            border: 1px solid var(--dim-green);
            color: var(--main-green);
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            width: 65px;
            font-family: var(--font-family);
        }
        .race-tab.active .race-tab-name {
            border-color: var(--main-green);
        }

        /* 予算設定 */
        .budget-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-step {
            background: var(--dark-green);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-step:active {
            background: var(--main-green);
            color: #000;
        }

        .budget-display {
            flex: 1;
            text-align: center;
            font-size: 1.35rem;
            font-weight: bold;
            background: #000;
            border: 1px solid var(--dim-green);
            border-radius: 6px;
            padding: 6px 0;
            color: var(--main-green);
            text-shadow: 0 0 6px var(--main-green);
            font-family: 'Courier New', monospace;
        }

        /* リスク設定 */
        .risk-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .risk-btn {
            background: var(--dark-green);
            border: 1px solid var(--dim-green);
            color: var(--dim-green);
            padding: 8px 4px;
            font-size: 0.75rem;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            line-height: 1.3;
        }

        .risk-btn.active {
            border-color: var(--main-green);
            color: #000;
            background: var(--main-green);
            font-weight: bold;
            box-shadow: 0 0 8px var(--main-green);
        }

        /* 予算連動上限インジケーター */
        .limits-info {
            display: flex;
            justify-content: space-around;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.6);
            padding: 6px;
            border-radius: 4px;
            margin-top: 8px;
            border: 1px dashed var(--dim-green);
        }

        .limit-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-jiku { color: var(--jiku-color); font-weight: bold; }
        .tag-chuana { color: var(--chuana-color); font-weight: bold; }
        .tag-oana { color: var(--oana-color); font-weight: bold; }

        /* 馬番トグルグリッド */
        .horse-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .horse-btn {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid var(--dim-green);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .horse-num {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .horse-badge {
            font-size: 0.6rem;
            font-weight: bold;
            line-height: 1;
            margin-top: 2px;
        }

        .horse-btn[data-type="JIKU"] {
            border-color: var(--jiku-color);
            background: rgba(255, 51, 102, 0.2);
            box-shadow: 0 0 6px var(--jiku-color);
        }
        .horse-btn[data-type="JIKU"] .horse-num,
        .horse-btn[data-type="JIKU"] .horse-badge { color: var(--jiku-color); }

        .horse-btn[data-type="CHUANA"] {
            border-color: var(--chuana-color);
            background: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 6px var(--chuana-color);
        }
        .horse-btn[data-type="CHUANA"] .horse-num,
        .horse-btn[data-type="CHUANA"] .horse-badge { color: var(--chuana-color); }

        .horse-btn[data-type="OANA"] {
            border-color: var(--oana-color);
            background: rgba(0, 204, 255, 0.2);
            box-shadow: 0 0 6px var(--oana-color);
        }
        .horse-btn[data-type="OANA"] .horse-num,
        .horse-btn[data-type="OANA"] .horse-badge { color: var(--oana-color); }

        .horse-btn[data-type="EXCLUDE"] {
            border-color: #888888;
            background: rgba(136, 136, 136, 0.15);
            box-shadow: 0 0 6px #888888;
        }
        .horse-btn[data-type="EXCLUDE"] .horse-num,
        .horse-btn[data-type="EXCLUDE"] .horse-badge { color: #aaaaaa; }

        /* ターミナル出力 */
        .terminal {
            background: #000;
            border: 1px solid var(--main-green);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.75rem;
            line-height: 1.45;
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            box-shadow: inset 0 0 8px rgba(0, 255, 102, 0.2);
            font-family: 'Courier New', monospace;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-act {
            background: var(--dark-green);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .btn-act:active {
            background: var(--main-green);
            color: #000;
        }

        .btn-reset {
            border-color: #ff3366;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
        }
        .btn-reset:active {
            background: #ff3366;
            color: #000;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--main-green);
            color: #000;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 10px var(--main-green);
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <div class="header-title-area">
                <img id="headerIconPreview" class="icon-preview" alt="Icon Preview">
                <h1>SYSTEM: BET MATRIX</h1>
            </div>
            <div class="sub-title">SANRENPUKU & WIDE ALLOCATOR v2.2</div>
        </header>

        <!-- [3] 馬番選択 -->
        <div class="panel">
            <div class="panel-title">
                <span>[3] SELECT HORSES</span>
                <span style="font-size:0.65rem; color:var(--dim-green);">1タップで状態切り替え</span>
            </div>
            <div class="race-tabs" id="raceTabs"></div>
            <div class="horse-grid" id="horseGrid"></div>
        </div>

        <!-- [4] ターミナル出力 -->
        <div class="panel">
            <div class="panel-title">[4] OUTPUT TERMINAL</div>
            <div class="terminal" id="terminal"></div>
            <div class="action-btns">
                <button class="btn-act btn-reset" onclick="resetSelections()">リセット</button>
                <button class="btn-act" onclick="copyToClipboard()">コピー</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">クリップボードにコピーしました</div>

    <script>
        // --- 1. Apple Touch Icon (180x180 PNG Canvas) 動的生成 ---
        (function generateIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#050805';
            ctx.fillRect(0, 0, 180, 180);

            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 4;
            ctx.strokeRect(4, 4, 172, 172);

            const horseImage = new Image();
            horseImage.onload = function() {
                ctx.drawImage(horseImage, 20, 20, 140, 140);

                const dataUri = canvas.toDataURL('image/png');

                const appleIconLink = document.getElementById('appleTouchIcon');
                if (appleIconLink) {
                    appleIconLink.href = dataUri;
                }

                const headerPreview = document.getElementById('headerIconPreview');
                if (headerPreview) {
                    headerPreview.src = dataUri;
                }
            };

            horseImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAMAAAAvK2D7AAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAAZQTFRF////00003Uf3eAAAAMElEQVR42u3XQQqAMBAEwSj+/83DgxB8wToIup302k3Nmtda+952932e53mvh18mCwoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgr/C34mO3me53me53me53n/3AM4a1/vXwFvTAAAAABJRU5ErkJggg==';
        })();

        // --- 2. 背景 Matrix Digital Rain ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width = bgCanvas.width = window.innerWidth;
        let height = bgCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
        });

        const chars = '0123456789ABCDEF★▲●';
        const fontSize = 14;
        const columns = Math.floor(width / fontSize) + 1;
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            bgCtx.fillStyle = 'rgba(5, 8, 5, 0.1)';
            bgCtx.fillRect(0, 0, width, height);
            bgCtx.fillStyle = '#00ff66';
            bgCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                bgCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // --- 3. アプリケーション状態 & 構成 ---
        let state = {
            currentRace: 1,
            races: {
                1: { name: '', horses: {} },
                2: { name: '', horses: {} },
                3: { name: '', horses: {} },
                4: { name: '', horses: {} },
                5: { name: '', horses: {} },
                6: { name: '', horses: {} },
                7: { name: '', horses: {} },
                8: { name: '', horses: {} },
                9: { name: '', horses: {} },
                10: { name: '', horses: {} }
            }
        };

        function loadState() {
            try {
                const saved = localStorage.getItem('matrix_horse_bet_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.races) {
                        for (let i = 1; i <= 10; i++) {
                            if (parsed.races[i]) {
                                if (typeof parsed.races[i] === 'object' && parsed.races[i].horses !== undefined) {
                                    state.races[i] = parsed.races[i];
                                } else {
                                    state.races[i] = { name: '', horses: parsed.races[i] || {} };
                                }
                            }
                        }
                    }
                    if (parsed.currentRace && parsed.currentRace <= 10) {
                        state.currentRace = parsed.currentRace;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('matrix_horse_bet_state', JSON.stringify(state));
            } catch (e) {
                console.error(e);
            }
        }

        function selectRace(raceNum) {
            state.currentRace = raceNum;
            updateUI();
            saveState();
        }

        function updateRaceName(raceNum, name) {
            if (!state.races[raceNum]) {
                state.races[raceNum] = { name: '', horses: {} };
            }
            state.races[raceNum].name = name;
            saveState();
        }

        function toggleHorse(num) {
            if (!state.races[state.currentRace]) {
                state.races[state.currentRace] = { name: '', horses: {} };
            }
            const currentRaceObj = state.races[state.currentRace];
            const horses = currentRaceObj.horses || {};
            const current = horses[num] || 'NONE';
            const sequence = ['NONE', 'JIKU', 'CHUANA', 'OANA', 'EXCLUDE'];
            let nextIndex = (sequence.indexOf(current) + 1) % sequence.length;

            const candidate = sequence[nextIndex];
            if (candidate === 'NONE') {
                delete horses[num];
            } else {
                horses[num] = candidate;
            }
            currentRaceObj.horses = horses;

            updateUI();
            saveState();
        }

        function resetSelections() {
            if (state.races[state.currentRace]) {
                state.races[state.currentRace].horses = {};
            }
            updateUI();
            saveState();
        }

        function updateUI() {
            // タブの描画 (1〜10)
            const tabsContainer = document.getElementById('raceTabs');
            tabsContainer.innerHTML = '';
            for (let r = 1; r <= 10; r++) {
                const tab = document.createElement('div');
                tab.className = `race-tab ${state.currentRace === r ? 'active' : ''}`;
                
                const raceData = state.races[r] || { name: '', horses: {} };
                
                tab.innerHTML = `
                    <span class="race-tab-num">${r}</span>
                    <input type="text" class="race-tab-name" placeholder="レース名" value="${raceData.name || ''}" oninput="updateRaceName(${r}, this.value)" onclick="event.stopPropagation()">
                `;
                tab.onclick = () => selectRace(r);
                tabsContainer.appendChild(tab);
            }

            // 馬番グリッドの描画
            const grid = document.getElementById('horseGrid');
            grid.innerHTML = '';
            const currentRaceObj = state.races[state.currentRace] || { name: '', horses: {} };
            const currentHorses = currentRaceObj.horses || {};
            for (let i = 1; i <= 18; i++) {
                const btn = document.createElement('div');
                const type = currentHorses[i] || 'NONE';
                btn.className = 'horse-btn';
                btn.setAttribute('data-type', type);
                btn.onclick = () => toggleHorse(i);

                let badge = '';
                if (type === 'JIKU') badge = '軸';
                else if (type === 'CHUANA') badge = '中';
                else if (type === 'OANA') badge = '大';
                else if (type === 'EXCLUDE') badge = '×';

                btn.innerHTML = `
                    <div class="horse-num">${i < 10 ? '0' + i : i}</div>
                    <div class="horse-badge">${badge}</div>
                `;
                grid.appendChild(btn);
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('terminal').innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast());
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            let hasData = false;
            for (let i = 1; i <= 10; i++) {
                if (Object.keys(state.races[i].horses || {}).length > 0 || state.races[i].name) {
                    hasData = true;
                    break;
                }
            }
            if (!hasData) {
                state.races[1] = { name: '東京11R', horses: { 1: 'JIKU', 5: 'CHUANA', 8: 'CHUANA', 12: 'OANA' } };
            }
            updateUI();
        });
    </script>
</body>
</html>
